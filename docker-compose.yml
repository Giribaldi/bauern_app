services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: local_market
      POSTGRES_PASSWORD: password
      POSTGRES_DB: local_market
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U local_market -d local_market']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://local_market:password@postgres:5432/local_market
      API_PORT: '3000'
      PUBLIC_STOREFRONT_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ['node', 'dist/index.js']
    environment:
      DATABASE_URL: postgresql://local_market:password@postgres:5432/local_market
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    ports:
      - '3001:3000'
    environment:
      PORT: '3000'
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - '3002:3001'
    environment:
      PORT: '3001'
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
